[package]
name = "protobuilder"
version = "1.0.0"
edition = "2021"
authors = ["ProtoBuilder Team"]
description = "Single-executable, zero-dependency Protocol Buffers & gRPC compiler and multi-language code generator."
license = "MIT"

[[bin]]
name = "protobuilder"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
